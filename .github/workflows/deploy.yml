# Builds the site with fresh satellite data and publishes it to GitHub Pages.
# Runs on every push to main, once a day, and on demand (Actions tab -> Run workflow).
# Satellite data is fetched at build time and never committed, so the repo stays small.
name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *' # 03:17 UTC daily (1:17 pm Brisbane)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch satellite data from CelesTrak
        run: node scripts/fetch-satellites.mjs

      # Shipping-lanes tiles: built once from the 510 MB World Bank file, then reused from the
      # Actions cache on every later build. Editing scripts/build-lanes.py rebuilds them.
      - name: Restore shipping-lanes tiles
        id: lanes-cache
        uses: actions/cache@v4
        with:
          path: site/tiles/lanes
          key: lanes-v1-${{ hashFiles('scripts/build-lanes.py') }}

      - name: Build shipping-lanes tiles
        if: steps.lanes-cache.outputs.cache-hit != 'true'
        run: |
          pip install --quiet rasterio pillow numpy
          python3 scripts/build-lanes.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

name = "earth-tracker"
main = "src/index.js"
compatibility_date = "2026-11-01"

# Serve on the public workers.dev address (the app calls it from GitHub Pages).
workers_dev = true
# Don't publish a separate URL for every uploaded version: fewer public addresses to worry about.
preview_urls = false

[vars]
# Sites allowed to call this API from a browser. Add your local dev server if you use one.
ALLOWED_ORIGINS = "https://luxswilli4m.github.io,http://localhost:8080"

# Brute-force protection for the sign-in endpoint: 10 attempts per minute per IP.
# If `wrangler deploy` rejects this block on your plan, delete it; sign-in still works without it.
[[ratelimits]]
name = "LOGIN_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 10
  period = 60

# Stage 2: the live-ship relay. One shared object holds the single aisstream.io connection.
[[durable_objects.bindings]]
name = "SHIPS"
class_name = "ShipRelay"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ShipRelay"]
